apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: egress
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: https://github.com/rumstead/homelab.git
    targetRevision: HEAD
    path: kubernetes/manifests/egress
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
