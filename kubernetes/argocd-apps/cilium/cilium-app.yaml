apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  source:
    repoURL: https://helm.cilium.io/
    chart: cilium
    targetRevision: 1.20.2
    helm:
      valuesObject:
        ipam:
          mode: kubernetes
        kubeProxyReplacement: true
        k8sServiceHost: 192.168.1.245
        k8sServicePort: 6443
        gatewayAPI:
          enabled: true
        l2announcements:
          enabled: true
        externalIPs:
          enabled: true
        devices:
          - "enp+"
          - "eth+"
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        # Agents only read cilium-config at startup, so roll them on config
        # changes, one node at a time.
        rollOutCiliumPods: true
        updateStrategy:
          rollingUpdate:
            maxUnavailable: 1
        # Agent and operator metrics back the Cilium Grafana dashboards
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
        operator:
          rollOutPods: true
          prometheus:
            enabled: true
            serviceMonitor:
              enabled: true
              labels:
                release: kube-prometheus-stack
        dashboards:
          enabled: true
          namespace: monitoring
          # The dashboard JSON is too big for client-side apply's
          # last-applied annotation
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
        hubble:
          # Must be 2^n - 1
          eventBufferCapacity: "16383"
          tls:
            auto:
              # The helm method generates a new CA on every Argo CD render
              method: certmanager
              certManagerIssuerRef:
                group: cert-manager.io
                kind: ClusterIssuer
                name: homelab-ca-issuer
          relay:
            enabled: true
          ui:
            enabled: true
          metrics:
            enabled:
              - flows-to-world:any-drop;port;sourceContext=workload-name|reserved-identity;destinationContext=dns|ip
              - dns:query;ignoreAAAA;sourceContext=workload-name|reserved-identity
              - drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
              - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
              - tcp
              - port-distribution
            serviceMonitor:
              enabled: true
              labels:
                release: kube-prometheus-stack
            dashboards:
              enabled: true
              namespace: monitoring
              annotations:
                argocd.argoproj.io/sync-options: ServerSideApply=true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
