apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.9.0
      helm:
        valuesObject:
          # Grafana config
          grafana:
            enabled: true
            # SOPS-encrypted in kubernetes/manifests/monitoring/sops. Without
            # it the chart generates a new password on every Argo CD render.
            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              passwordKey: admin-password
            service:
              type: ClusterIP
            # Security context for Talos compatibility
            securityContext:
              runAsNonRoot: true
              runAsUser: 472
              runAsGroup: 472
              fsGroup: 472
              fsGroupChangePolicy: OnRootMismatch
            initChownData:
              enabled: false
            # Enable persistence for dashboards
            persistence:
              enabled: true
              size: 1Gi
            # Additional scrape targets for host machine
            additionalDataSources:
              - name: Prometheus
                type: prometheus
                url: http://kube-prometheus-stack-prometheus:9090
                isDefault: false
            # Enable sidecar for dashboard provisioning from ConfigMaps
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
                folder: /tmp/dashboards
                searchNamespace: monitoring
                provider:
                  foldersFromFilesStructure: true
          
          # Prometheus config
          prometheus:
            prometheusSpec:
              podSecurityContext:
                fsGroup: 0
                fsGroupChangePolicy: OnRootMismatch
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                runAsGroup: 0
              # Allow ServiceMonitor discovery across all namespaces
              serviceMonitorNamespaceSelector: {}
              serviceMonitorSelector:
                matchLabels:
                  release: kube-prometheus-stack
              # Scrape interval
              scrapeInterval: 30s
              # Retention
              retention: 7d
              retentionSize: "9GB"
              # WAL compression reduces WAL size and speeds recovery after unclean shutdown
              walCompression: true
              # On Talos, subPath bind mounts resolve against the
              # ephemeral overlay instead of the persistent vdb1 mount, causing
              # all Prometheus data to be lost on every reboot.
              storageSpec:
                disableMountSubPath: true
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi
              # Additional scrape configs for host machine
              additionalScrapeConfigs:
                - job_name: 'host-node-exporter'
                  static_configs:
                    - targets: ['192.168.1.234:9100']
                      labels:
                        instance: 'ubuntu-host'
                - job_name: 'host-process-exporter'
                  static_configs:
                    - targets: ['192.168.1.234:9256']
                      labels:
                        instance: 'ubuntu-host'
          
          # AlertManager with email notifications
          alertmanager:
            enabled: true
            alertmanagerSpec:
              # Full config (Gmail SMTP, routes, receivers) lives in the
              # SOPS secret kubernetes/manifests/monitoring/sops/alertmanager-config.sops.yaml
              useExistingSecret: true
              configSecret: alertmanager-config
              storage:
                disableMountSubPath: true
                volumeClaimTemplate:
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 1Gi
          
          # Node exporter for VM metrics (runs as DaemonSet on k8s nodes)
          nodeExporter:
            enabled: true
          
          # Kube-state-metrics
          kubeStateMetrics:
            enabled: true

          # kube-proxy is replaced by Cilium, nothing to scrape
          kubeProxy:
            enabled: false

          # Talos binds the scheduler and controller-manager to localhost and
          # runs etcd outside Kubernetes, so Prometheus can't scrape any of them.
          kubeScheduler:
            enabled: false
          kubeControllerManager:
            enabled: false
          kubeEtcd:
            enabled: false

          defaultRules:
            rules:
              # Alerts for the components above, which aren't scraped
              kubeSchedulerAlerting: false
              kubeSchedulerRecording: false
              kubeControllerManager: false
              etcd: false
              windows: false
              # API server error-budget burn (KubeAPIErrorBudgetBurn) isn't
              # actionable with a single control plane node
              kubeApiserverSlos: false
            disabled:
              # Alertmanager failing to send can't be delivered by Alertmanager
              AlertmanagerFailedToSendAlerts: true
              AlertmanagerClusterFailedToSendAlerts: true
              # Alertmanager runs one replica, so there is no cluster to watch
              AlertmanagerClusterDown: true
              AlertmanagerClusterCrashlooping: true
              AlertmanagerClusterFailedPeers: true
              AlertmanagerMembersInconsistent: true
              AlertmanagerConfigInconsistent: true
              # Two nodes with no spare capacity to fail over to
              KubeCPUOvercommit: true
              KubeMemoryOvercommit: true
              # The kubelet reports no usage for local-path volumes, so these
              # can't fire. NodeFilesystem* alerts cover the disks they live on.
              KubePersistentVolumeFillingUp: true
              KubePersistentVolumeInodesFillingUp: true
    - repoURL: https://github.com/rumstead/homelab.git
      targetRevision: main
      path: kubernetes/manifests/monitoring
    - repoURL: https://github.com/rumstead/homelab.git
      targetRevision: main
      path: kubernetes/manifests/monitoring/sops
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
