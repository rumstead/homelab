apiVersion: v1
kind: ConfigMap
metadata:
  name: lifting-data-scripts
  namespace: lifting-data
data:
  ingest-and-plot.sh: |
    #!/bin/sh
    set -eu

    DB=/app/data/lifts.db

    echo "[lifting-data] init-db"
    python3 -m lifting_data.cli --db "$DB" init-db

    echo "[lifting-data] ingest-email"
    python3 -m lifting_data.cli --db "$DB" ingest-email \
      --imap-user "$GMAIL_USER" \
      --source-mailbox "lift-data/workouts" \
      --processed-mailbox "lift-data/processed" \
      --allow-sender "$GMAIL_USER"

    echo "[lifting-data] generating charts"
    python3 -m lifting_data.cli --db "$DB" list-exercises \
      | sed 's/: [0-9]* sets$//' \
      | while IFS= read -r exercise; do
          safe_name=$(echo "$exercise" | tr ' /' '--' | tr '[:upper:]' '[:lower:]')
          echo "  plotting: $exercise -> ${safe_name}.html"
          python3 -m lifting_data.cli --db "$DB" plot \
            --exercise "$exercise" \
            --output "/app/output/${safe_name}.html" || true
        done

    echo "[lifting-data] done"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lifting-data-nginx
  namespace: lifting-data
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        location / {
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;
        }
    }
