# nginx runs as uid 101 on 8080 with a read-only root filesystem; it writes /var/cache/nginx and /run (emptyDirs).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifting-data-web
  namespace: lifting-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lifting-data-web
  template:
    metadata:
      labels:
        app: lifting-data-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.31.10-alpine
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: output
              mountPath: /usr/share/nginx/html
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: lifting-data-output
        - name: nginx-config
          configMap:
            name: lifting-data-nginx
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lifting-data-web
  namespace: lifting-data
spec:
  selector:
    app: lifting-data-web
  ports:
    - port: 80
      targetPort: 8080
