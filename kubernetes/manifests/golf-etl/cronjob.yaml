# Runs in github mode by default: videos come from the inbox on the golf-etl-data volume and sessions are pushed
# to rumstead/golf-sessions with the deploy key from golf-etl-deploy-key.sops.yaml (edit with `sops`).
# The pod is pinned to the node that holds the RWO volume, next to the upload pod.
# Forbid plus no in-place restarts lets the app treat anything left in processing/ as orphaned.
# The Drive token in golf-etl-rclone.sops.yaml stays so GOLF_STORAGE=drive (and args poll-drive) rolls back.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: golf-etl-poll
  namespace: golf-etl
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: talos-hk3-kam
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poll
              image: ghcr.io/rumstead/golf-etl:latest
              imagePullPolicy: Always
              args: ["poll"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: golf-etl-config
                - secretRef:
                    name: golf-etl-rclone
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "4"
                  memory: 6Gi
              volumeMounts:
                - name: scratch
                  mountPath: /scratch
                - name: data
                  mountPath: /data
                - name: deploy-key
                  mountPath: /etc/golf-etl/ssh
                  readOnly: true
          volumes:
            - name: scratch
              emptyDir:
                sizeLimit: 10Gi
            - name: data
              persistentVolumeClaim:
                claimName: golf-etl-data
            - name: deploy-key
              secret:
                secretName: golf-etl-deploy-key
                defaultMode: 0400
                items:
                  - key: id_ed25519
                    path: id_ed25519
