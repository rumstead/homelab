apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress
  namespace: external-dns
specs:
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: external-dns
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEntities:
          - kube-apiserver
      # The AdGuard provider sidecar writes records through AdGuard's API.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: adguard
              app: adguard-home
        toPorts:
          - ports:
              - port: "80"
                protocol: TCP
