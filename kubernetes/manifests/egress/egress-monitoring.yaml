apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress
  namespace: monitoring
specs:
  # The operator, Grafana's sidecars, kube-state-metrics, Prometheus's service
  # discovery and the chart's admission jobs all use the API.
  - endpointSelector: {}
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEntities:
          - kube-apiserver
  # Prometheus scrapes pods in every namespace, the nodes, kubelets and
  # crete's exporters, and sends alerts to Alertmanager.
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEndpoints:
          - matchExpressions:
              - key: k8s:io.kubernetes.pod.namespace
                operator: Exists
      - toEntities:
          - host
          - remote-node
      - toCIDR:
          - 192.168.1.234/32
        toPorts:
          - ports:
              - port: "9100"
                protocol: TCP
              - port: "9256"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: grafana
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: prometheus
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: alertmanager
        toPorts:
          - ports:
              - port: "9093"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: alertmanager
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toFQDNs:
          - matchName: smtp.gmail.com
        toPorts:
          - ports:
              - port: "587"
                protocol: TCP
  # The operator checks kubelet endpoints on the nodes.
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: kube-prometheus-stack-prometheus-operator
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEntities:
          - host
          - remote-node
        toPorts:
          - ports:
              - port: "10250"
                protocol: TCP
  # The Monday reminder reads Prometheus and sends one email.
  - endpointSelector:
      matchLabels:
        app: weekly-reminder
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: prometheus
        toPorts:
          - ports:
              - port: "9090"
                protocol: TCP
      - toFQDNs:
          - matchName: smtp.gmail.com
        toPorts:
          - ports:
              - port: "587"
                protocol: TCP
