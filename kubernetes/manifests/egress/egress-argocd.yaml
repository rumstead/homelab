apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress
  namespace: argocd
specs:
  # Every Argo CD component talks to the Kubernetes API.
  - endpointSelector: {}
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEntities:
          - kube-apiserver
  - endpointSelector:
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
            - argocd-application-controller
            - argocd-applicationset-controller
            - argocd-notifications-controller
            - argocd-server
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: argocd-repo-server
        toPorts:
          - ports:
              - port: "8081"
                protocol: TCP
  - endpointSelector:
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
            - argocd-application-controller
            - argocd-notifications-controller
            - argocd-repo-server
            - argocd-server
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: argocd-redis
        toPorts:
          - ports:
              - port: "6379"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: argocd-server
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: argocd-dex-server
        toPorts:
          - ports:
              - port: "5556"
                protocol: TCP
              - port: "5557"
                protocol: TCP
  # Git and Helm sources for the apps this repo deploys.
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: argocd-repo-server
    enableDefaultDeny:
      egress: false
      ingress: false
    egress:
      - toFQDNs:
          - matchName: github.com
          - matchName: raw.githubusercontent.com
          - matchName: release-assets.githubusercontent.com
          - matchName: objects.githubusercontent.com
          - matchName: helm.cilium.io
          - matchName: charts.jetstack.io
          - matchName: pkgs.tailscale.com
          - matchPattern: "*.github.io"
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
