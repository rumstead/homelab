apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-egress
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana-dashboard-description: "Traffic leaving the cluster per workload, from Hubble metrics"
data:
  egress.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Traffic leaving the cluster per workload, from Hubble metrics",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "row",
          "title": "Overview",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Workloads reaching the internet",
          "description": "Distinct source workloads with flows to reserved:world in the selected range",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(count by (source) (increase(hubble_flows_to_world_total{source=~\"$source\"}[$__range]) > 0))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "External destinations",
          "description": "Distinct destination hostnames or IPs",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(count by (destination) (increase(hubble_flows_to_world_total{source=~\"$source\"}[$__range]) > 0))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Flows to the internet",
          "description": "",
          "id": 4,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(hubble_flows_to_world_total{source=~\"$source\"}[$__range]))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "type": "stat",
          "title": "Dropped flows to the internet",
          "description": "",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(increase(hubble_flows_to_world_total{source=~\"$source\",verdict=\"DROPPED\"}[$__range])) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "type": "row",
          "title": "Egress",
          "id": 6,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Flows to the internet by workload",
          "description": "",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (source) (rate(hubble_flows_to_world_total{source=~\"$source\"}[5m]))",
              "legendFormat": "{{source}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "table",
          "title": "Workload to destination",
          "description": "Every external destination per workload in the selected range. Destination is the DNS name when the Cilium DNS proxy saw the lookup, otherwise the IP",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            },
            "overrides": []
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Flows"
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "source": "Workload",
                  "destination": "Destination",
                  "protocol": "Protocol",
                  "port": "Port",
                  "verdict": "Verdict",
                  "Value": "Flows"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (source, destination, protocol, port, verdict) (increase(hubble_flows_to_world_total{source=~\"$source\"}[$__range])) > 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        },
        {
          "type": "row",
          "title": "DNS",
          "id": 9,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "DNS queries by workload",
          "description": "",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 27
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (source) (rate(hubble_dns_queries_total{source=~\"$source\"}[5m]))",
              "legendFormat": "{{source}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "table",
          "title": "Names resolved by workload",
          "description": "",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 35
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            },
            "overrides": []
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Flows"
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "source": "Workload",
                  "query": "Query",
                  "Value": "Flows"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (source, query) (increase(hubble_dns_queries_total{source=~\"$source\"}[$__range])) > 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        },
        {
          "type": "row",
          "title": "Drops",
          "id": 12,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 47
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Dropped flows by reason",
          "description": "",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "fieldConfig": {
            "defaults": {
              "unit": "pps",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "mean",
                "max"
              ],
              "displayMode": "table",
              "placement": "right",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (reason) (rate(hubble_drop_total[5m]))",
              "legendFormat": "{{reason}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "table",
          "title": "Dropped flows by workload",
          "description": "",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 48
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              }
            },
            "overrides": []
          },
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Flows"
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "source": "Source",
                  "destination": "Destination",
                  "reason": "Reason",
                  "Value": "Flows"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sort_desc(sum by (source, destination, reason) (increase(hubble_drop_total[$__range])) > 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        }
      ],
      "refresh": "1m",
      "schemaVersion": 42,
      "tags": [
        "cilium",
        "hubble",
        "egress"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            },
            "refresh": 1
          },
          {
            "name": "source",
            "label": "Workload",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(hubble_flows_to_world_total, source)",
            "query": {
              "query": "label_values(hubble_flows_to_world_total, source)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "refresh": 2
          }
        ]
      },
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "title": "Egress",
      "uid": "hubble-egress",
      "version": 1
    }
