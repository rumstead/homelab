apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-weekly
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana-dashboard-description: "This week next to last week: crete, cluster, security and watchers"
data:
  homelab-weekly.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "This week next to last week: crete, cluster, security and watchers",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "row",
          "title": "crete",
          "id": 1,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "timeseries",
          "title": "CPU average",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 5,
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".*last week"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "gray"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\", job=\"host-node-exporter\"}[5m] )))",
              "legendFormat": "this week"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "100 * (1 - avg(rate(node_cpu_seconds_total{mode=\"idle\", job=\"host-node-exporter\"}[5m] offset 7d)))",
              "legendFormat": "last week"
            }
