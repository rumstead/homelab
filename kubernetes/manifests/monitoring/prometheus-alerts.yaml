apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: host-storage.rules
      rules:
        # Host filesystem filling up (scraped via node-exporter on host)
        - alert: HostFilesystemAlmostFull
          expr: |
            (
              node_filesystem_avail_bytes{job="host-node-exporter", fstype!~"tmpfs|overlay"}
              /
              node_filesystem_size_bytes{job="host-node-exporter", fstype!~"tmpfs|overlay"}
            ) < 0.15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Host filesystem is above 85% capacity"
            description: >-
              Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }}
              has only {{ $value | humanizePercentage }} free space remaining.
              This may affect VM persistent storage (qcow2 images at /mnt/persistent/disks/).
            runbook: |
              1. Check host disk usage: ssh acemagic 'df -h'
              2. Check qcow2 actual sizes: ssh acemagic 'sudo qemu-img info /mnt/persistent/disks/*.qcow2'
              3. Clean package cache: ssh acemagic 'sudo apt clean'
              4. Check large files: ssh acemagic 'sudo du -sh /var/log/* | sort -rh | head'

        # Host filesystem critically full
        - alert: HostFilesystemCritical
          expr: |
            (
              node_filesystem_avail_bytes{job="host-node-exporter", fstype!~"tmpfs|overlay"}
              /
              node_filesystem_size_bytes{job="host-node-exporter", fstype!~"tmpfs|overlay"}
            ) < 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Host filesystem is critically full (>95%)"
            description: >-
              Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }}
              has only {{ $value | humanizePercentage }} free space remaining.
              VM disk writes may fail imminently.

    - name: host-health.rules
      rules:
        # Host booted within the last hour. After an unplanned reset the
        # cluster comes back on its own, so this is the only signal.
        - alert: HostRebooted
          expr: time() - node_boot_time_seconds{job="host-node-exporter"} < 3600
          labels:
            severity: warning
          annotations:
            summary: "Host rebooted {{ $value | humanizeDuration }} ago"
            description: >-
              {{ $labels.instance }} booted within the last hour. If you did not
              reboot it, the watchdog or a kernel panic did.
            runbook: |
              1. Was it clean? ssh acemagic 'last -x -F | head -5' (a "shutdown" line means planned)
              2. Panic text: ssh acemagic 'sudo ls -la /var/lib/systemd/pstore /var/crash'
              3. Previous boot kernel log: ssh acemagic 'journalctl -b -1 -k | grep -iE "hung|panic|blocked for more than"'
