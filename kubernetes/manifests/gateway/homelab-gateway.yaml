apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
spec:
  gatewayClassName: cilium
  # Pin the gateway LoadBalancer IP so it never races AdGuard (.246) or the
  # control plane (.245), and external-dns records stay stable.
  addresses:
    - type: IPAddress
      value: 192.168.1.247
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
