apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-policy
spec:
  loadBalancerIPs: true
  externalIPs: true
  interfaces:
    - ^eth[0-9]+
    - ^enp[0-9]+s[0-9]+
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-pool
spec:
  blocks:
    # NOTE: start at .246 — 192.168.1.245 is the control plane node /
    # kube-apiserver IP and must NOT be handed out to LoadBalancer services,
    # otherwise Cilium L2 ARP-announces it and hijacks the API server.
    - start: 192.168.1.246
      stop: 192.168.1.254
