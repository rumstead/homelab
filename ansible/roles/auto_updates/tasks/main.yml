---
- name: Install the host update and reboot scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - host-auto-update.sh
    - host-reboot-window.sh

- name: Install the host update and reboot units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - host-auto-update.service
    - host-auto-update.timer
    - host-reboot-window.service
    - host-reboot-window.timer
  register: auto_updates_units

- name: Run apt and snap updates daily and reboot weekly when they need it
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: "{{ auto_updates_units.changed }}"
  loop:
    - host-auto-update.timer
    - host-reboot-window.timer
  ignore_errors: "{{ ansible_check_mode and auto_updates_units.changed }}"  # noqa: ignore-errors
