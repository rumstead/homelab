---
- name: Install the host auto-update script
  ansible.builtin.copy:
    src: host-auto-update.sh
    dest: /usr/local/bin/host-auto-update.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the host auto-update service and timer
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - host-auto-update.service
    - host-auto-update.timer
  register: auto_updates_units

- name: Run apt and snap updates daily
  ansible.builtin.systemd_service:
    name: host-auto-update.timer
    enabled: true
    state: started
    daemon_reload: "{{ auto_updates_units.changed }}"
