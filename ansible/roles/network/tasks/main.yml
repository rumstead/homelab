---
# A wired NIC is a PCI Ethernet device that isn't wireless. Once br0 exists the
# NIC is still there as a bridge member, so this finds the same one on every run.
- name: Find the wired NICs
  ansible.builtin.set_fact:
    network_wired_nics: >-
      {{ ansible_facts.interfaces | map('regex_replace', '-', '_') | map('extract', ansible_facts)
         | selectattr('type', 'defined') | selectattr('type', 'equalto', 'ether')
         | selectattr('pciid', 'defined') | map(attribute='device') | reject('match', 'wl') | sort }}
  when: host_nic is not defined

- name: Stop unless there is exactly one wired NIC
  ansible.builtin.assert:
    that: network_wired_nics | length == 1
    fail_msg: "Wired NICs: {{ network_wired_nics | join(', ') or 'none' }}. Set host_nic in ansible/group_vars/all.yml."
    quiet: true
  when: host_nic is not defined

- name: Use the wired NIC as the host NIC
  ansible.builtin.set_fact:
    host_nic: "{{ network_wired_nics | first }}"
  when: host_nic is not defined

- name: Check that the host NIC exists
  ansible.builtin.assert:
    that: host_nic in ansible_facts.interfaces
    fail_msg: "{{ host_nic }} not found. Interfaces: {{ ansible_facts.interfaces | join(', ') }}. Fix host_nic in ansible/group_vars/all.yml."
    quiet: true

# Installer files can hold a Wi-Fi password, so only file names are read. A
# NetworkManager renderer takes every NIC without naming it.
- name: Find other netplan files that configure the host NIC
  ansible.builtin.shell: |
    set -o pipefail
    { grep -lw {{ host_nic | quote }} /etc/netplan/*.yaml
      grep -liE 'renderer:[[:space:]]*NetworkManager' /etc/netplan/*.yaml
    } 2> /dev/null | sort -u | grep -vx /etc/netplan/01-ethernet-cfg.yaml || true
  args:
    executable: /bin/bash
  register: network_conflicts
  check_mode: false
  changed_when: false
  no_log: true

- name: Stop when another netplan file configures the host NIC
  ansible.builtin.fail:
    msg: >-
      Remove or rename these netplan files, they also configure {{ host_nic }}
      or hand it to NetworkManager: {{ network_conflicts.stdout_lines | join(', ') }}
  when: network_conflicts.stdout_lines | length > 0

# netplan is never applied here: a bad bridge config would cut the host off.
- name: Bridge the host NIC as {{ bridge_name }}
  ansible.builtin.template:
    src: 01-ethernet-cfg.yaml.j2
    dest: /etc/netplan/01-ethernet-cfg.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Generate netplan

- name: Flush the netplan handler
  ansible.builtin.meta: flush_handlers

- name: Stop until the bridge exists
  ansible.builtin.fail:
    msg: "/etc/netplan/01-ethernet-cfg.yaml is written but {{ bridge_name }} does not exist yet. Reboot (or run `sudo netplan try`), then re-run the playbook."
  when: bridge_name not in ansible_facts.interfaces
