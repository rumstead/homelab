---
- name: Install Lynis
  ansible.builtin.apt:
    name: lynis
    state: present

- name: Read the installed Trivy version
  ansible.builtin.command: /usr/local/bin/trivy --version
  register: host_scanning_trivy_version
  check_mode: false
  changed_when: false
  failed_when: false

- name: Install the pinned Trivy release
  when: >-
    (host_scanning_trivy_version.stdout | regex_search('Version: ([0-9.]+)', '\\1') or ['']) | first
    != trivy_version
  block:
    - name: Create a download directory for Trivy
      ansible.builtin.tempfile:
        state: directory
      register: host_scanning_tmp
      check_mode: false
      changed_when: false

    - name: Download Trivy
      ansible.builtin.get_url:
        url: "{{ host_scanning_trivy_base }}/trivy_{{ trivy_version }}_Linux-64bit.tar.gz"
        dest: "{{ host_scanning_tmp.path }}/trivy.tar.gz"
        checksum: "sha256:{{ host_scanning_trivy_base }}/trivy_{{ trivy_version }}_checksums.txt"
        mode: "0644"
      check_mode: false

    - name: Unpack Trivy
      ansible.builtin.unarchive:
        src: "{{ host_scanning_tmp.path }}/trivy.tar.gz"
        dest: "{{ host_scanning_tmp.path }}"
        remote_src: true
        include: [trivy]
      check_mode: false

    - name: Copy Trivy to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ host_scanning_tmp.path }}/trivy"
        dest: /usr/local/bin/trivy
        remote_src: true
        owner: root
        group: root
        mode: "0755"
  always:
    - name: Remove the Trivy download directory
      ansible.builtin.file:
        path: "{{ host_scanning_tmp.path }}"
        state: absent
      when: host_scanning_tmp.path is defined
      check_mode: false
      changed_when: false

- name: Create the scanner directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ host_scanning_state_dir }}", mode: "0700" }
    - { path: "{{ host_scanning_lib_dir }}", mode: "0755" }
    - { path: /var/cache/host-scanning, mode: "0700" }

- name: Write the accepted host findings
  ansible.builtin.copy:
    dest: "{{ host_scanning_lib_dir }}/accepted.json"
    owner: root
    group: root
    mode: "0644"
    content: "{{ host_scanning_trivy_accepted | to_nice_json }}\n"

- name: Install the shared metrics helper
  ansible.builtin.copy:
    src: textfile_metrics.py
    dest: "{{ host_scanning_lib_dir }}/textfile_metrics.py"
    owner: root
    group: root
    mode: "0644"

- name: Install the scanners
  ansible.builtin.copy:
    src: "{{ item.name }}"
    dest: "/usr/local/sbin/{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ host_scanning_scanners }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the scanner services
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Host scanner {{ item.name }}
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      Environment=HOST_SCANNING_TEXTFILE_DIR={{ host_scanning_textfile_dir }}
      Environment=HOST_SCANNING_STATE_DIR={{ host_scanning_state_dir }}
      Environment=HOST_TRIVY_DIRS={{ host_scanning_trivy_dirs | join(':') }}
      ExecStart=/usr/local/sbin/{{ item.name }}
      Nice=10
      IOSchedulingClass=idle
  loop: "{{ host_scanning_scanners }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for host scanning

- name: Install the scanner timers
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Run {{ item.name }} on a schedule

      [Timer]
      OnCalendar={{ item.schedule }}
      RandomizedDelaySec=15m
      Persistent=true

      [Install]
      WantedBy=timers.target
  loop: "{{ host_scanning_scanners }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for host scanning

- name: Flush the systemd reload
  ansible.builtin.meta: flush_handlers

# In check mode the unit files above are not written yet.
- name: Enable the scanner timers
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ host_scanning_scanners }}"
  loop_control:
    label: "{{ item.name }}"
  ignore_errors: "{{ ansible_check_mode }}"

# A timer that has never fired waits for its first scheduled time, so a
# scanner without results is started once now instead of alerting as missing.
- name: Check which scanners have results
  ansible.builtin.stat:
    path: "{{ host_scanning_textfile_dir }}/{{ item.metrics }}.prom"
  loop: "{{ host_scanning_scanners }}"
  loop_control:
    label: "{{ item.name }}"
  register: host_scanning_results

- name: Start scanners that have no results yet
  ansible.builtin.systemd_service:
    name: "{{ item.item.name }}.service"
    state: started
    no_block: true
  loop: "{{ host_scanning_results.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
  ignore_errors: "{{ ansible_check_mode }}"
